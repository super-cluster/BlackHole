<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Dark background with subtle radial glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#07070e"/>
    </radialGradient>

    <!-- Primary A gradient: indigo → violet -->
    <linearGradient id="a-grad" x1="16" y1="3" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Crossbar accent: cyan highlight -->
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Subtle outer glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg-glow)"/>

  <!-- Subtle border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#6366f1" stroke-width="0.6" opacity="0.35"/>

  <!-- Letter A — geometric, sharp strokes -->
  <!-- Left leg -->
  <polygon
    points="7,29 12.2,29 16,7 13.5,7"
    fill="url(#a-grad)"
    filter="url(#glow)"
  />
  <!-- Right leg -->
  <polygon
    points="25,29 19.8,29 16,7 18.5,7"
    fill="url(#a-grad)"
    filter="url(#glow)"
  />
  <!-- Crossbar with cyan accent -->
  <rect
    x="10.5" y="18.5" width="11" height="2.5" rx="0.5"
    fill="url(#bar-grad)"
    filter="url(#glow)"
  />
</svg>